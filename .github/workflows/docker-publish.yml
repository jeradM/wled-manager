name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      # The version is the newest published X.Y.Z with its patch number bumped, unless one of these is ticked.
      new_minor:
        description: "New Minor: bump the minor version (1.3.4 → 1.4.0) instead of the patch (→ 1.3.5)"
        required: false
        type: boolean
        default: false
      new_major:
        description: "New Major: bump the major version (1.3.4 → 2.0.0); wins over New Minor"
        required: false
        type: boolean
        default: false
      latest:
        description: "Also tag as latest"
        required: false
        type: boolean
        default: true
      platforms:
        description: "Platforms to build (arm64 is built under emulation and takes longer)"
        required: true
        type: choice
        default: linux/amd64,linux/arm64
        options:
          - linux/amd64,linux/arm64
          - linux/amd64

concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and push to GHCR
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
        if: contains(inputs.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lowercase; the repository owner may not be.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The published images are the record of past versions: take the highest X.Y.Z tag and bump it.
      # Runs are serialized (see concurrency), so two can't pick the same version.
      - name: Next version
        id: version
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_MAJOR: ${{ inputs.new_major }}
          NEW_MINOR: ${{ inputs.new_minor }}
        run: |
          set -euo pipefail
          repo="${IMAGE#ghcr.io/}"
          registry_token=$(curl -fsS -u "$ACTOR:$TOKEN" "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token)
          current=$(curl -fsS -H "Authorization: Bearer $registry_token" "https://ghcr.io/v2/${repo}/tags/list?n=10000" \
            | jq -r '.tags[]?' | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)
          current=${current:-0.0.0}
          IFS=. read -r major minor patch <<< "$current"
          if [[ "$NEW_MAJOR" == "true" ]]; then
            major=$((major + 1)); minor=0; patch=0
          elif [[ "$NEW_MINOR" == "true" ]]; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          next="$major.$minor.$patch"
          echo "Previous version: $current, next: $next"
          echo "value=$next" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable=${{ inputs.latest }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published ${{ steps.version.outputs.value }}"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
